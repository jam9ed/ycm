      <path d="M15.6 8.4 L10.9 10.9 L8.4 15.6 L13.1 13.1 Z"/>
    </g>
  </symbol>
  <symbol id="sp-wave" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M2 9.5 Q6 6.4 10 9.5 Q14 12.6 18 9.5 Q20.4 7.6 22 8.6"/>
      <path d="M2 15 Q6 11.9 10 15 Q14 18.1 18 15 Q20.4 13.1 22 14.1"/>
