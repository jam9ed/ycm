      <circle cx="12" cy="12" r="2.2"/>
      <path d="M12 9.8 Q9.4 3.6 13.6 2.6 Q16.6 2 14.1 10.6"/>
      <path d="M13.9 13.1 Q20.6 12.4 20.2 16.6 Q19.9 19.7 12.8 14.6"/>
      <path d="M10.6 13.6 Q7.4 19.5 3.9 17.1 Q1.4 15.3 9.9 11.9"/>
    </g>
  </symbol>
  <symbol id="sp-cleat" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 13 H18"/>
