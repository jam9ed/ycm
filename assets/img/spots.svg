<!-- Original line drawings for v4. Nothing traced or borrowed: a few nautical
     spots plus a cat, drawn on a 24x24 grid to sit beside headings. The anchor
     is a nod to the old site, which separated its listings with rows of anchor
     emoji. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="sp-anchor" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="4.2" r="2.1"/>
      <path d="M12 6.3 V20.4"/>
      <path d="M7.4 9.4 H16.6"/>
      <path d="M4.4 13.6 Q4.4 20.4 12 20.4 Q19.6 20.4 19.6 13.6"/>
      <path d="M2.7 14.8 L4.4 13.2 L6.1 14.8"/>
      <path d="M17.9 14.8 L19.6 13.2 L21.3 14.8"/>
    </g>
  </symbol>
  <symbol id="sp-ring" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="12" cy="12" r="8.6"/>
      <circle cx="12" cy="12" r="3.9"/>
      <path d="M12 3.4 V8.1 M12 15.9 V20.6 M3.4 12 H8.1 M15.9 12 H20.6" stroke-linecap="round"/>
    </g>
  </symbol>
  <symbol id="sp-prop" viewBox="0 0 24 24">
